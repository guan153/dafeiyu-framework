<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一家三口</title>
<link rel="icon" href="/assets/fish_smile.png">
<style>
  :root{
    --text:#1b2530; --dim:#6b7c8e; --faint:#8b9aab;
    --baby:#b8791a; --baby-bg:#fff4dc; --baby-bd:#efdcb4;
    --mom:#2f7cb0; --mom-bg:#eef7ff; --mom-bd:#cfe5f7;
    --fish:#bf5678; --fish-bg:#fdeef3; --fish-bd:#f4cede;
    --tool:#5d7082; --tool-bg:#f2f5f9; --tool-bd:#dfe7ef;
    --glass:rgba(255,255,255,.86);
    --hair:rgba(255,255,255,.55);
    --who-bg:rgba(255,255,255,.82);
    --who-fg:#41556a;
    --panel:rgba(255,255,255,.94);
    --shadow:rgba(21,38,58,.10);
    --ease:cubic-bezier(.22,.9,.3,1);
    --px:0px; --py:0px;
  }
  body.dark{
    --text:#e7eef6; --dim:#93a6b8; --faint:#76889b;
    --baby-bg:#3a2f1a; --baby-bd:#5a4726; --baby:#e8bb6a;
    --mom-bg:#16303f; --mom-bd:#24506a; --mom:#7cc0e8;
    --fish-bg:#3a1e28; --fish-bd:#5e3040; --fish:#f0a0ba;
    --tool-bg:#1c2733; --tool-bd:#2a3a49;
    --glass:rgba(18,28,40,.86);
    --hair:rgba(255,255,255,.08);
    --who-bg:rgba(20,30,42,.8);
    --who-fg:#a9bccd;
    --panel:rgba(20,30,42,.96);
    --shadow:rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:"Microsoft YaHei UI","PingFang SC","Noto Sans SC",system-ui,sans-serif;
    color:var(--text);display:flex;height:100vh;overflow:hidden;font-size:14px;
    background:#dfe7f0;-webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:-3%;
    background:url("/assets/bg.jpg") center 18%/cover no-repeat;
    transform:translate3d(var(--px),var(--py),0) scale(1.04);
    transition:transform .5s cubic-bezier(.2,.7,.3,1);
    will-change:transform;z-index:-2;
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(130% 80% at 50% -12%, rgba(255,255,255,.30), transparent 58%),
      linear-gradient(180deg, rgba(255,255,255,.10), rgba(226,235,246,.20)),
      linear-gradient(0deg, rgba(246,249,252,.96) 0%, rgba(246,249,252,.62) 7%, rgba(246,249,252,0) 17%);
  }
  body.dark::after{
    background:
      linear-gradient(180deg, rgba(8,14,22,.55), rgba(8,14,22,.72)),
      linear-gradient(0deg, rgba(8,14,22,.92) 0%, rgba(8,14,22,.5) 14%, transparent 26%);
  }

  .chat{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;animation:appIn .7s var(--ease) both}
  @keyframes appIn{from{opacity:0;transform:scale(.994)}to{opacity:1;transform:none}}

  header{
    position:relative;flex:0 0 auto;padding:11px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:var(--glass);
    backdrop-filter:blur(22px) saturate(1.75);-webkit-backdrop-filter:blur(22px) saturate(1.75);
    box-shadow:inset 0 1px 0 var(--hair), 0 10px 30px var(--shadow);
    border-bottom:1px solid rgba(255,255,255,.42);z-index:6;
  }
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(60,130,190,.35),transparent)}
  .faces{display:flex;align-items:center}
  .faces img{width:32px;height:32px;border-radius:50%;object-fit:cover;margin-left:-9px;border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 8px var(--shadow);transition:transform .28s var(--ease),box-shadow .28s}
  .faces img:first-child{margin-left:0}
  .faces img:hover{transform:translateY(-3px) scale(1.12);box-shadow:0 8px 18px var(--shadow);z-index:2;position:relative}
  .htitle{font-size:15px;font-weight:700;letter-spacing:.4px;background:linear-gradient(100deg,#1f2d3b 0%,#3f6d92 32%,#1f2d3b 64%,#4a7fa8 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:titleShine 9s ease-in-out infinite}
  body.dark .htitle{background:linear-gradient(100deg,#cfe3f5 0%,#7fb4d8 32%,#cfe3f5 64%,#9cc8e4 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text}
  @keyframes titleShine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .hsub{font-size:11.5px;color:var(--dim);margin-top:1px;display:flex;gap:8px;flex-wrap:wrap}
  .rooms{display:flex;gap:4px;margin-left:4px}
  .rooms button{
    border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.45);color:#5b6e82;
    border-radius:9px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit;
    backdrop-filter:blur(8px);transition:transform .18s var(--ease),background .2s,color .2s,box-shadow .2s;
    display:flex;align-items:center;gap:5px;white-space:nowrap;
  }
  body.dark .rooms button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12);color:#9fb4c8}
  .rooms button:hover{transform:translateY(-1px);color:var(--text);box-shadow:0 4px 12px var(--shadow)}
  .rooms button.on{background:rgba(255,255,255,.92);color:var(--text);font-weight:600;box-shadow:0 3px 10px var(--shadow)}
  body.dark .rooms button.on{background:rgba(255,255,255,.16)}
  .rooms button .n{
    font-size:10px;padding:0 4px;border-radius:8px;background:rgba(47,124,176,.15);color:#2f7cb0;
  }
  .hsub .ok{color:#2e9c63;font-weight:600}
  .hsub .bad{color:#c2564f;font-weight:600}
  .spacer{flex:1}
  .hbtn{border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.5);color:#516478;border-radius:10px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit;backdrop-filter:blur(8px);transition:transform .2s var(--ease),box-shadow .25s,background .2s,color .2s}
  body.dark .hbtn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12);color:#9fb4c8}
  .hbtn:hover{transform:translateY(-2px);background:rgba(255,255,255,.85);color:var(--text);box-shadow:0 6px 16px var(--shadow)}
  .hbtn:active{transform:translateY(0) scale(.97)}
  .hbtn.on{border-color:rgba(216,164,74,.6);background:rgba(255,246,226,.9);color:#9a6f16}

  .searchbar{display:none;width:100%;margin-top:8px;gap:8px;align-items:center}
  .searchbar.open{display:flex;animation:fadeIn .22s var(--ease)}
  .searchbar input{flex:1;background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.9);border-radius:10px;padding:8px 12px;font-size:13px;font-family:inherit;outline:none;color:var(--text);transition:box-shadow .25s}
  body.dark .searchbar input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12)}
  .searchbar input:focus{box-shadow:0 0 0 3px rgba(120,175,220,.25)}
  .searchbar .cnt{font-size:11.5px;color:var(--dim);white-space:nowrap}

  #feed{flex:1;overflow-y:auto;padding:20px 22px 10px;scroll-behavior:smooth}
  #feed::-webkit-scrollbar{width:9px}
  #feed::-webkit-scrollbar-thumb{background:rgba(255,255,255,.55);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
  body.dark #feed::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);background-clip:padding-box}

  .loadmore{display:none;text-align:center;padding:6px 0 2px}
  .loadmore.show{display:block}
  .loadmore button{border:1px solid rgba(255,255,255,.7);background:var(--who-bg);color:var(--dim);border-radius:20px;padding:4px 14px;font-size:11.5px;font-family:inherit;cursor:pointer;transition:.2s}
  .loadmore button:hover{color:var(--text);transform:translateY(-1px)}

  .day{text-align:center;margin:14px 0 18px;font-size:11px;color:#4d5f70;letter-spacing:.6px}
  body.dark .day{color:#8ea3b8}
  .day span{background:var(--who-bg);padding:3px 12px;border-radius:20px;backdrop-filter:blur(10px);box-shadow:0 2px 8px var(--shadow)}

  .row{display:flex;gap:10px;margin-bottom:15px;align-items:flex-start;position:relative}
  .row.compact{margin-top:-9px}
  .row.new{animation:msgIn .42s var(--ease) both}
  @keyframes msgIn{0%{opacity:0;transform:translateY(14px) scale(.97);filter:blur(4px)}60%{filter:blur(0)}100%{opacity:1;transform:none;filter:none}}
  .row.baby{flex-direction:row-reverse}
  .row.hidden{display:none}

  .av{width:42px;height:42px;border-radius:13px;object-fit:cover;flex:0 0 42px;background:rgba(255,255,255,.6);border:1.5px solid rgba(255,255,255,.85);box-shadow:0 3px 10px var(--shadow);transition:transform .3s var(--ease),box-shadow .3s}
  .av.tool{display:grid;place-items:center;font-size:19px;background:rgba(238,244,250,.9);color:#6b829b}
  .av.ghost{visibility:hidden}
  .row:hover .av{transform:translateY(-2px) scale(1.05) rotate(-1.5deg);box-shadow:0 8px 20px var(--shadow)}

  .body{max-width:min(620px,72%);display:flex;flex-direction:column;gap:4px;position:relative}
  .row.baby .body{align-items:flex-end}
  .who{font-size:11px;color:var(--who-fg);padding:2px 9px;display:inline-flex;gap:7px;align-items:center;letter-spacing:.2px;border-radius:20px;background:var(--who-bg);backdrop-filter:blur(8px);box-shadow:0 1px 5px var(--shadow);align-self:flex-start}
  .row.baby .who{align-self:flex-end}
  .who .ch{font-size:9.5px;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.8);color:#6d8098;box-shadow:0 1px 3px var(--shadow)}
  body.dark .who .ch{background:rgba(255,255,255,.1);color:#9fb4c8}

  .bubble{padding:10px 14px;border-radius:15px;line-height:1.62;font-size:14px;color:var(--text);white-space:pre-wrap;word-break:break-word;border:1px solid var(--mom-bd);background:var(--mom-bg);box-shadow:0 2px 6px var(--shadow), 0 14px 30px var(--shadow), inset 0 0 0 1px rgba(255,255,255,.65);transition:transform .26s var(--ease),box-shadow .26s var(--ease);position:relative}
  .row.mom .bubble{border-bottom-left-radius:5px}
  .row.fish .bubble{background:var(--fish-bg);border-color:var(--fish-bd);border-bottom-left-radius:5px}
  .row.baby .bubble{background:var(--baby-bg);border-color:var(--baby-bd);border-bottom-right-radius:5px}
  .row.tool .bubble{background:var(--tool-bg);border-color:var(--tool-bd);border-bottom-left-radius:5px}
.row.dsh .bubble{background:rgba(90,167,216,.10);border-color:rgba(90,167,216,.32);border-bottom-left-radius:5px;border-left:3px solid #5aa7d8}
.av.tool.dsh{background:rgba(90,167,216,.16);border-color:rgba(90,167,216,.45);color:#2f7fb5}
  .row:hover .bubble{transform:translateY(-2px);box-shadow:0 6px 14px var(--shadow), 0 22px 44px var(--shadow)}
  .bubble.meme{padding:6px;background:rgba(255,255,255,.9);border-color:rgba(255,255,255,.9)}
  body.dark .bubble.meme{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1)}
  .bubble.meme img{max-width:172px;max-height:172px;border-radius:11px;display:block;cursor:zoom-in}
  .bubble.meme .capt{padding:7px 8px 3px;font-size:13px;line-height:1.55;color:var(--text);max-width:230px}

  /* 拍一拍：系统提示条 */
  .nudge{
    text-align:center;margin:2px 0 14px;font-size:11.5px;color:#6b7c8e;
    animation:nudgePop .5s var(--ease) both;
  }
  body.dark .nudge{color:#93a6b8}
  .nudge span{
    display:inline-block;padding:3px 12px;border-radius:20px;
    background:rgba(255,255,255,.7);box-shadow:0 1px 4px var(--shadow);
  }
  body.dark .nudge span{background:rgba(255,255,255,.08)}
  .nudge b{color:var(--text);font-weight:600}
  .nudge.task span{background:rgba(47,124,176,.12);color:#266a9c;border:1px solid rgba(47,124,176,.25)}
  body.dark .nudge.task span{background:rgba(120,190,235,.14);color:#9fd0f0;border-color:rgba(120,190,235,.25)}
  @keyframes nudgePop{
    0%{opacity:0;transform:scale(.86)}
    55%{opacity:1;transform:scale(1.06)}
    100%{opacity:1;transform:scale(1)}
  }
  .av{cursor:pointer;user-select:none}
  .row.fish .av:active,.row.mom .av:active{transform:scale(.92)}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-4px) rotate(-3deg)}
    50%{transform:translateX(4px) rotate(3deg)}
    80%{transform:translateX(-2px)}
  }
  .av.shake{animation:shake .45s ease}

  .quote{font-size:12px;line-height:1.5;padding:6px 9px;border-radius:9px;margin-bottom:5px;border-left:3px solid var(--mom);background:rgba(255,255,255,.6);color:var(--dim);max-width:100%}
  body.dark .quote{background:rgba(255,255,255,.07)}
  .quote b{color:var(--mom);font-weight:600}

  .msg-ops{position:absolute;top:-2px;right:-92px;display:flex;gap:3px;opacity:0;pointer-events:none;transition:opacity .18s var(--ease),transform .18s}
  .row.baby .msg-ops{right:auto;left:-92px}
  .row:hover .msg-ops{opacity:1;pointer-events:auto}
  .msg-ops button{width:26px;height:26px;border-radius:8px;border:1px solid rgba(255,255,255,.8);background:var(--who-bg);color:var(--dim);font-size:13px;cursor:pointer;display:grid;place-items:center;font-family:inherit;backdrop-filter:blur(8px);box-shadow:0 2px 6px var(--shadow);transition:.16s}
  .msg-ops button:hover{color:var(--text);transform:translateY(-1px);background:#fff}
  body.dark .msg-ops button:hover{background:rgba(255,255,255,.15)}

  .empty{text-align:center;color:#43566a;padding:90px 0;line-height:2.2;font-size:13.5px;text-shadow:0 1px 2px rgba(255,255,255,.7)}
  body.dark .empty{color:#8ea3b8;text-shadow:none}

  .jump{position:absolute;right:26px;bottom:96px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.9);background:var(--who-bg);backdrop-filter:blur(12px);color:var(--dim);font-size:17px;cursor:pointer;display:none;place-items:center;box-shadow:0 8px 22px var(--shadow);z-index:8;transition:transform .2s var(--ease)}
  .jump.show{display:grid}
  .jump:hover{transform:translateY(-2px);color:var(--text)}
  .jump .badge{position:absolute;top:-4px;right:-4px;background:#d8554e;color:#fff;font-size:10px;border-radius:20px;padding:1px 5px;font-weight:700}

  footer{position:relative;flex:0 0 auto;padding:10px 20px 15px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.75);-webkit-backdrop-filter:blur(22px) saturate(1.75);box-shadow:inset 0 1px 0 var(--hair), 0 -10px 30px var(--shadow);border-top:1px solid rgba(255,255,255,.42)}
  .composer{display:flex;gap:9px;align-items:flex-end}
  .ibtn{flex:0 0 auto;width:39px;height:39px;border-radius:12px;border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.62);color:#7288a0;font-size:18px;cursor:pointer;display:grid;place-items:center;font-family:inherit;backdrop-filter:blur(8px);transition:transform .2s var(--ease),background .2s,color .2s,box-shadow .2s}
  body.dark .ibtn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12);color:#9fb4c8}
  .ibtn:hover{transform:translateY(-2px);background:rgba(255,255,255,.92);color:var(--text);box-shadow:0 6px 16px var(--shadow)}
  .ibtn:active{transform:scale(.93)}
  #say{flex:1;min-height:39px;max-height:120px;resize:none;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.8);border-radius:12px;padding:9px 14px;color:var(--text);font-size:14px;font-family:inherit;outline:none;line-height:1.45;transition:background .2s,border-color .2s,box-shadow .3s var(--ease)}
  body.dark #say{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12)}
  #say::placeholder{color:#93a4b6}
  #say:focus{background:#fff;border-color:rgba(120,175,220,.55);box-shadow:0 0 0 4px rgba(120,175,220,.18), 0 8px 22px var(--shadow)}
  body.dark #say:focus{background:rgba(255,255,255,.12)}
  #send{position:relative;overflow:hidden;flex:0 0 auto;height:39px;padding:0 20px;border-radius:12px;border:none;cursor:pointer;background:linear-gradient(135deg,#2b3947,#1b2530);color:#fff;font-weight:600;font-size:13.5px;font-family:inherit;letter-spacing:.3px;box-shadow:0 4px 14px var(--shadow);transition:transform .16s var(--ease),box-shadow .28s,filter .2s}
  #send::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 28%,rgba(255,255,255,.55) 48%,transparent 68%);transform:translateX(-130%)}
  #send:hover{transform:translateY(-1px);box-shadow:0 10px 24px var(--shadow);filter:brightness(1.12)}
  #send:hover::after{animation:sweep .75s var(--ease)}
  @keyframes sweep{to{transform:translateX(130%)}}
  #send:active{transform:translateY(0) scale(.96)}
  #send:disabled{opacity:.5;cursor:default}
  .hint{font-size:10.5px;color:#5e7186;margin-top:7px;letter-spacing:.2px}
  body.dark .hint{color:#8299ad}

  .quotebar{display:none;margin-bottom:9px;padding:7px 11px;border-radius:10px;background:rgba(255,255,255,.72);border-left:3px solid var(--mom);font-size:12.5px;color:var(--dim);align-items:center;gap:10px;box-shadow:0 2px 8px var(--shadow)}
  body.dark .quotebar{background:rgba(255,255,255,.08)}
  .quotebar.show{display:flex;animation:fadeIn .2s var(--ease)}
  .quotebar .qtext{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .quotebar button{border:none;background:transparent;color:var(--dim);font-size:16px;cursor:pointer;padding:0 4px}
  .quotebar button:hover{color:var(--text)}

  #lightbox{position:fixed;inset:0;background:rgba(10,18,28,.82);backdrop-filter:blur(6px);z-index:99;display:none;place-items:center;cursor:zoom-out}
  #lightbox.show{display:grid;animation:fadeIn .2s}
  #lightbox img{max-width:82vw;max-height:82vh;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.5)}

  .ctx{position:fixed;z-index:120;display:none;background:var(--panel);border:1px solid rgba(255,255,255,.9);border-radius:11px;box-shadow:0 16px 40px rgba(21,38,58,.28);padding:5px;min-width:136px;backdrop-filter:blur(20px)}
  .ctx.show{display:block;animation:fadeIn .14s}
  .ctx button{display:block;width:100%;text-align:left;border:none;background:transparent;color:var(--text);font-size:12.5px;padding:7px 10px;border-radius:7px;cursor:pointer;font-family:inherit}
  .ctx button:hover{background:rgba(120,175,220,.16)}
  .ctx button.danger{color:#c2564f}

  .memes{display:none;position:absolute;left:20px;right:20px;bottom:70px;max-height:440px;background:var(--panel);backdrop-filter:blur(28px) saturate(1.6);border:1px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 30px 70px rgba(21,38,58,.28), inset 0 1px 0 #fff;z-index:20;flex-direction:column;overflow:hidden}
  .memes.open{display:flex;animation:panelUp .3s var(--ease)}
  @keyframes panelUp{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
  .mtabs,.ptabs{display:flex;gap:4px;padding:8px 10px;overflow-x:auto;flex:0 0 auto}
  .mtabs{border-bottom:1px solid rgba(21,38,58,.06)}
  .ptabs{border-bottom:1px solid rgba(21,38,58,.06);background:rgba(250,252,254,.55)}
  body.dark .ptabs{background:rgba(255,255,255,.03)}
  .mtabs button,.ptabs button{flex:0 0 auto;border:none;background:transparent;color:var(--dim);font-size:12px;padding:5px 11px;border-radius:8px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:background .18s,color .18s,transform .18s var(--ease)}
  .mtabs button:hover,.ptabs button:hover{color:var(--text);transform:translateY(-1px)}
  .mtabs button.on{background:rgba(58,125,180,.12);color:#266a9c}
  .ptabs button.on{background:rgba(21,38,58,.07);color:var(--text)}
  body.dark .mtabs button.on{background:rgba(120,175,220,.2);color:#9fd0f0}
  body.dark .ptabs button.on{background:rgba(255,255,255,.1)}
  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:7px;padding:10px;overflow-y:auto}
  .mgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer;background:#eef2f7;box-shadow:0 1px 3px var(--shadow);transition:transform .2s var(--ease),box-shadow .22s,outline-color .2s;outline:2px solid transparent}
  .mgrid img:hover{transform:translateY(-3px) scale(1.06);box-shadow:0 10px 22px var(--shadow);outline-color:rgba(58,125,180,.5)}

  .side{width:0;flex:0 0 auto;overflow:hidden;transition:width .34s var(--ease);background:var(--glass);backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);border-left:1px solid rgba(255,255,255,.6);box-shadow:-12px 0 40px var(--shadow);display:flex;flex-direction:column;z-index:5}
  .side.open{width:326px}
  .side-in{width:326px;display:flex;flex-direction:column;height:100%;overflow:hidden}
  .tabs{display:flex;gap:3px;padding:9px;border-bottom:1px solid rgba(21,38,58,.06);flex:0 0 auto}
  .tabs button{flex:1;border:none;background:transparent;color:var(--dim);font-size:12.5px;padding:7px;border-radius:9px;cursor:pointer;font-family:inherit;transition:background .2s,color .2s,transform .2s var(--ease)}
  .tabs button:hover{transform:translateY(-1px)}
  .tabs button.on{background:rgba(255,255,255,.9);color:var(--text);font-weight:600;box-shadow:0 2px 8px var(--shadow)}
  body.dark .tabs button.on{background:rgba(255,255,255,.12)}
  .pane{flex:1;overflow-y:auto;padding:13px;display:none;flex-direction:column;gap:10px}
  .pane.on{display:flex;animation:fadeIn .3s var(--ease)}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  .task{background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.9);border-radius:12px;padding:10px 11px;font-size:12.5px;box-shadow:0 2px 8px var(--shadow);transition:transform .22s var(--ease),box-shadow .24s}
  body.dark .task{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1)}
  .task:hover{transform:translateY(-2px);box-shadow:0 10px 22px var(--shadow)}
  .task .t{font-weight:600;margin-bottom:5px;line-height:1.4}
.task .r{color:#8b9aab;font-size:11px;line-height:1.5;margin-top:5px;white-space:pre-wrap;max-height:4.5em;overflow:hidden}
  .task .m{font-size:10.5px;color:var(--dim);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .pill{padding:1px 8px;border-radius:6px;background:rgba(21,38,58,.06)}
  body.dark .pill{background:rgba(255,255,255,.08)}
  .pill.doing{background:rgba(216,164,74,.18);color:#96690f}
  .pill.done{background:rgba(46,156,99,.16);color:#227a4d}
.pill.cancelled{background:rgba(140,150,160,.18);color:#5d6b7a}
.pill.blocked{background:rgba(200,80,80,.14);color:#a33}
  .newtask{display:flex;flex-direction:column;gap:7px;border-top:1px solid rgba(21,38,58,.07);padding-top:11px;margin-top:auto}
  .newtask input{width:100%;background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.9);border-radius:9px;padding:8px 10px;font-size:12.5px;font-family:inherit;outline:none;color:var(--text);transition:box-shadow .25s}
  body.dark .newtask input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12)}
  .newtask input:focus{background:#fff;box-shadow:0 0 0 3px rgba(120,175,220,.2)}
  .row2{display:flex;gap:7px}
  .row2>*{flex:1}
  .row2 select{background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.9);border-radius:9px;padding:7px;font-size:12px;font-family:inherit;outline:none;color:var(--text)}
  body.dark .row2 select{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12)}
  #addTask{border:none;border-radius:9px;background:linear-gradient(135deg,#2b3947,#1b2530);color:#fff;font-weight:600;font-size:12.5px;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px var(--shadow);transition:transform .18s var(--ease),box-shadow .2s,filter .2s}
  #addTask:hover{transform:translateY(-1px);filter:brightness(1.14)}
  #addTask:active{transform:scale(.97)}

  .memsec{border-bottom:1px solid rgba(21,38,58,.07);padding-bottom:12px;margin-bottom:5px}
  .memsec h4{margin:0 0 8px;font-size:12px;color:#5b6e82;font-weight:700;display:flex;align-items:center;gap:6px}
  body.dark .memsec h4{color:#9fb4c8}
  .memsec h4 .n{font-weight:400;color:var(--faint);font-size:11px}
  .mitem{font-size:12.5px;line-height:1.55;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.82);margin-bottom:6px;border-left:2.5px solid rgba(150,190,220,.8);box-shadow:0 1px 4px var(--shadow);transition:transform .2s var(--ease),background .2s}
  body.dark .mitem{background:rgba(255,255,255,.06)}
  .mitem.hot{border-left-color:#e9b95c;background:rgba(255,251,242,.92)}
  body.dark .mitem.hot{background:rgba(233,185,92,.12)}
  .mitem:hover{transform:translateX(3px)}
  .mitem .imp{font-size:10px;color:var(--faint);margin-left:6px}
  .diary,.mymem{font-size:12.5px;line-height:1.72;color:#41525f;background:rgba(255,255,255,.82);border-radius:10px;padding:10px;white-space:pre-wrap}
  body.dark .diary,body.dark .mymem{color:#b9cadb;background:rgba(255,255,255,.06)}
  .diary{max-height:200px;overflow-y:auto}
  .moodbar{display:flex;flex-wrap:wrap;gap:5px}
  .moodbar span{font-size:11px;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.8);color:#5e7186;box-shadow:0 1px 3px var(--shadow);transition:transform .2s var(--ease)}
  body.dark .moodbar span{background:rgba(255,255,255,.08);color:#9fb4c8}
  .moodbar span:hover{transform:translateY(-2px)}

  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(12px);background:rgba(28,38,50,.92);color:#fff;font-size:12.5px;padding:8px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:.25s var(--ease);z-index:200}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  mark{background:rgba(255,214,102,.55);color:inherit;border-radius:3px;padding:0 1px}
  body.dark mark{background:rgba(255,214,102,.32)}
  .at{color:#2f7cb0;font-weight:600}
  body.dark .at{color:#7cc0e8}

  @media (max-width:900px){
    .side{position:fixed;right:0;top:0;bottom:0;width:0;height:100%;z-index:40}
    .side.open{width:min(86vw,340px)}
    .side-in{width:min(86vw,340px)}
    .body{max-width:84%}
    .msg-ops{right:-4px;top:-30px}
    .row.baby .msg-ops{left:auto;right:-4px}
    header{padding:9px 12px;gap:8px}
    #feed{padding:14px 12px 8px}
    footer{padding:9px 12px 12px}
    .hsub{display:none}
  }
</style>
</head>
<body>
<div class="chat">
  <header>
    <div class="faces">
      <img src="/assets/mom.png" alt="妈妈">
      <img src="/assets/fish_smile.png" alt="大肥鱼">
    </div>
    <div>
      <div class="htitle">一家三口</div>
      <div class="hsub" id="hsub"></div>
    </div>
    <div class="spacer"></div>
    <div class="rooms" id="rooms"></div>
    <button class="hbtn" id="btnSearch" title="搜索（Ctrl+K）" aria-label="搜索消息">搜索</button>
    <button class="hbtn" id="btnTheme" title="深色/浅色" aria-label="切换深色模式">深色</button>
    <button class="hbtn" id="btnSide" aria-label="打开记忆面板">记忆</button>
    <button class="hbtn" id="btnQQ" aria-label="切换 QQ 同步">QQ 同步：关</button>
    <div class="searchbar" id="searchbar">
      <input id="searchInput" placeholder="搜消息内容…… Esc 退出" autocomplete="off">
      <span class="cnt" id="searchCnt"></span>
    </div>
  </header>

  <div class="loadmore" id="loadmore"><button id="loadMoreBtn">加载更早的消息</button></div>

  <div id="feed" role="log" aria-live="polite" aria-label="家庭对话"><div class="empty">屋里还没人说话</div></div>

  <button class="jump" id="jumpNew" title="回到最新" aria-label="回到最新消息">↓<span class="badge" id="jumpBadge"></span></button>

  <div class="memes" id="memes" aria-label="表情包面板">
    <div class="ptabs" id="ptabs"></div>
    <div class="mtabs" id="mtabs"></div>
    <div class="mgrid" id="mgrid"></div>
  </div>

  <footer>
    <div class="quotebar" id="quotebar">
      <span class="qtext" id="quotetext"></span>
      <button id="quoteCancel" title="取消引用">✕</button>
    </div>
    <div class="composer">
      <button class="ibtn" id="memeBtn" title="表情包" aria-label="打开表情包">☺</button>
      <button class="ibtn" id="atBtn" title="@ 她俩" aria-label="提到某人">@</button>
      <textarea id="say" rows="1" placeholder="说点什么……" aria-label="输入消息"></textarea>
      <button id="send">发送</button>
    </div>
    <div class="hint" id="hintText">回车发送 · Shift+回车换行 · Ctrl+K 搜索</div>
  </footer>
</div>

<aside class="side" id="side" aria-label="记忆与任务面板">
  <div class="side-in">
    <div class="tabs" id="sideTabs">
      <button data-pane="mem" class="on">记忆</button>
      <button data-pane="tasks">任务</button>
    </div>
    <div class="pane on" id="paneMem">
      <div class="memsec"><h4>🐟 她记得的 <span class="n" id="memCount"></span></h4><div id="herMems"></div></div>
      <div class="memsec"><h4>她今天的心情</h4><div class="moodbar" id="herMood"></div></div>
      <div class="memsec"><h4>她的日记</h4><div id="herDiary"></div></div>
      <div class="memsec" style="border:none"><h4>🐋 我的记忆（工作区）</h4><div class="mymem" id="myMem">—</div></div>
    </div>
    <div class="pane" id="paneTasks">
      <div class="newtask" style="border:none;padding:0;margin:0">
        <input type="text" id="ntTitle" placeholder="任务标题">
        <div class="row2">
          <select id="ntWho">
            <option value="both">两人协作</option>
            <option value="mom">鲸鱼少女</option>
            <option value="fish">大肥鱼</option>
          </select>
          <button id="addTask">颁布</button>
        </div>
      </div>
      <div id="tasklist" style="display:flex;flex-direction:column;gap:8px;margin-top:4px"></div>
    </div>
  </div>
</aside>

<div id="lightbox"><img id="lightboxImg" alt=""></div>
<div class="ctx" id="ctx"></div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const feed=$('feed'), hsub=$('hsub'), sayEl=$('say'), sendBtn=$('send');
const memesEl=$('memes'), ptabs=$('ptabs'), mtabs=$('mtabs'), mgrid=$('mgrid');
const side=$('side'), quotebar=$('quotebar'), ctx=$('ctx'), toast=$('toast');

const AV={mom:'/assets/mom.png',fish:'/assets/fish_cheer.png'};
const NAME={baby:'宝宝',mom:'鲸鱼少女',fish:'大肥鱼',dsh:'DSH',hermes:'Hermes',deepseek:'DeepSeek',codex:'Codex',grok:'Grok',kimi:'Kimi'};
const ICON={dsh:'🛠',hermes:'⚙',deepseek:'🐋',codex:'⌘',grok:'✦',kimi:'◈'};

let lastKey=null, atBottom=true, first=true, limit=260;
let memeItems=[], memesLoaded=false, curPack='all', curCat='all', memeShown=120, memeTotal=0;
let toQQ=false, quote=null, searchQ='', unread=0, blinkTimer=null, lastTotal=0;
let curRoom='family';        // family / fish / mom
let roomLastTotal={};        // 每个房间上次看到的条数
let roomScroll={};           // 每个房间的滚动位置
const seenKeys=new Set();
let msgIndex=new Map();   // key -> msg

/* 背景视差 */
let rafId=0;
document.addEventListener('mousemove',e=>{
  if(rafId)return;
  rafId=requestAnimationFrame(()=>{
    rafId=0;
    const x=(e.clientX/window.innerWidth-.5)*16, y=(e.clientY/innerHeight-.5)*12;
    document.documentElement.style.setProperty('--px',x.toFixed(1)+'px');
    document.documentElement.style.setProperty('--py',y.toFixed(1)+'px');
  });
});

/* 主题 */
const urlTheme = new URLSearchParams(location.search).get('theme');
if(urlTheme==='dark' || (urlTheme!=='light' && localStorage.getItem('theme')==='dark')) document.body.classList.add('dark');
function syncThemeBtn(){ $('btnTheme').textContent = document.body.classList.contains('dark')?'浅色':'深色'; }
syncThemeBtn();
$('btnTheme').addEventListener('click',()=>{
  document.body.classList.toggle('dark');
  localStorage.setItem('theme', document.body.classList.contains('dark')?'dark':'light');
  syncThemeBtn();
});

/* 搜索 */
function openSearch(open){
  $('searchbar').classList.toggle('open', open);
  if(open){ $('searchInput').focus(); }
  else { $('searchInput').value=''; searchQ=''; applySearch(); }
}
$('btnSearch').addEventListener('click',()=>openSearch(!$('searchbar').classList.contains('open')));
$('searchInput').addEventListener('input',e=>{ searchQ=e.target.value.trim(); applySearch(); });
function applySearch(){
  let n=0;
  feed.querySelectorAll('.row').forEach(r=>{
    const txt=(r.dataset.text||'');
    if(!searchQ){ r.classList.remove('hidden'); r.querySelectorAll('mark').forEach(m=>m.outerHTML=m.textContent); return; }
    const hit=txt.includes(searchQ);
    r.classList.toggle('hidden',!hit);
    if(hit) n++;
  });
  $('searchCnt').textContent = searchQ? `${n} 条` : '';
}

/* 滚动 */
feed.addEventListener('scroll',()=>{
  atBottom = feed.scrollTop+feed.clientHeight >= feed.scrollHeight-80;
  if(atBottom){ unread=0; updateJump(); document.title='一家三口'; }
});
function updateJump(){
  const j=$('jumpNew');
  j.classList.toggle('show', !atBottom);
  const b=$('jumpBadge');
  if(unread>0){ b.textContent=unread>99?'99+':unread; b.style.display=''; }
  else b.style.display='none';
}
$('jumpNew').addEventListener('click',()=>{
  feed.scrollTo({top:feed.scrollHeight, behavior:'smooth'});
  unread=0; updateJump(); document.title='一家三口';
});

/* 输入 */
sayEl.addEventListener('input',()=>{
  sayEl.style.height='auto';
  sayEl.style.height=Math.min(120,sayEl.scrollHeight)+'px';
  localStorage.setItem('draft', sayEl.value);
});
sayEl.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); }
});
const draft=localStorage.getItem('draft');
if(draft){ sayEl.value=draft; sayEl.style.height='auto'; sayEl.style.height=Math.min(120,sayEl.scrollHeight)+'px'; }

/* @ */
$('atBtn').addEventListener('click',()=>{
  const at = sayEl.value.endsWith(' ')||!sayEl.value ? '' : ' ';
  sayEl.value += at + '@大肥鱼 ';
  sayEl.focus();
  sayEl.dispatchEvent(new Event('input'));
});
$('atBtn').addEventListener('contextmenu',e=>{ e.preventDefault();
  sayEl.value += (sayEl.value.endsWith(' ')||!sayEl.value?'':' ') + '@妈妈 ';
  sayEl.focus(); sayEl.dispatchEvent(new Event('input'));
});

/* 引用 */
function setQuote(m){
  quote={who:NAME[m.role]||m.who||'', text:m.text||'[表情包]'};
  $('quotetext').textContent=`引用 ${quote.who}：${quote.text.slice(0,60)}`;
  quotebar.classList.add('show');
  sayEl.focus();
}
$('quoteCancel').addEventListener('click',()=>{ quote=null; quotebar.classList.remove('show'); });

/* 表情面板 */
$('memeBtn').addEventListener('click',async()=>{
  memesEl.classList.toggle('open');
  if(memesEl.classList.contains('open')&&!memesLoaded) await loadMemes();
});
async function loadMemes(){
  try{ memeItems=((await (await fetch('/api/memes')).json()).items)||[]; }catch(e){ memeItems=[]; }
  memesLoaded=true;
  const packs=[...new Set(memeItems.map(m=>m.pack))];
  // 记住上次用的包和分类
  const savedPack=localStorage.getItem('memePack');
  const savedCat=localStorage.getItem('memeCat');
  if(savedPack && packs.includes(savedPack)) curPack=savedPack;
  if(savedCat) curCat=savedCat;
  ptabs.innerHTML='<button data-p="all" class="'+(curPack==='all'?'on':'')+'">全部包</button>'+packs.map(p=>{
    const nm=(memeItems.find(x=>x.pack===p)||{}).packName||p;
    return `<button data-p="${p}" class="${curPack===p?'on':''}">${nm}</button>`;
  }).join('');
  drawCats();
}
function drawCats(){
  const pool=curPack==='all'?memeItems:memeItems.filter(m=>m.pack===curPack);
  const cats=[...new Set(pool.map(m=>m.category))].sort();
  if(!cats.includes(curCat)) curCat='all';
  memeShown=120;   // 换包/换分类时从头显示
  ptabs2(cats);
  drawMemes();
}
function ptabs2(cats){
  mtabs.innerHTML='<button data-c="all" class="'+(curCat==='all'?'on':'')+'">全部</button>'+cats.map(c=>
    `<button data-c="${c}" class="${curCat===c?'on':''}">${c}</button>`).join('');
}
function drawMemes(){
  let list=curPack==='all'?memeItems:memeItems.filter(m=>m.pack===curPack);
  if(curCat!=='all') list=list.filter(m=>m.category===curCat);
  memeTotal=list.length;
  memeShown=Math.min(memeShown||120, memeTotal);
  mgrid.innerHTML=list.slice(0,memeShown).map(m=>
    `<img src="${m.url}" loading="lazy" data-url="${m.url}" data-cat="${m.category}" title="${esc(m.caption||m.category)}" alt="${esc(m.caption||'')}">`
  ).join('')||'<div style="grid-column:1/-1;color:#8b9aab;font-size:12px;text-align:center;padding:22px">这个分类没有图</div>';
  if(memeShown<memeTotal){
    mgrid.insertAdjacentHTML('beforeend',
      `<div style="grid-column:1/-1;text-align:center;padding:6px"><button id="moreMemesBtn" style="border:1px solid rgba(21,38,58,.12);background:rgba(255,255,255,.8);color:#6d8098;border-radius:18px;padding:5px 14px;font-size:12px;font-family:inherit;cursor:pointer">还有 ${memeTotal-memeShown} 张，点这看更多</button></div>`);
    const btn=$('moreMemesBtn');
    if(btn) btn.onclick=()=>{ memeShown+=180; drawMemes(); };
  }
}
ptabs.addEventListener('click',e=>{
  const b=e.target.closest('button[data-p]'); if(!b)return;
  curPack=b.dataset.p;
  localStorage.setItem('memePack', curPack);
  [...ptabs.querySelectorAll('button')].forEach(x=>x.classList.toggle('on',x===b));
  drawCats();
});
mtabs.addEventListener('click',e=>{
  const b=e.target.closest('button[data-c]'); if(!b)return;
  curCat=b.dataset.c;
  localStorage.setItem('memeCat', curCat);
  [...mtabs.querySelectorAll('button')].forEach(x=>x.classList.toggle('on',x===b));
  drawMemes();
});
mgrid.addEventListener('click',async e=>{
  const img=e.target.closest('img[data-url]'); if(!img)return;
  memesEl.classList.remove('open');
  await postSay({text:'[表情包] '+img.dataset.cat, kind:'meme', media:img.dataset.url});
});

/* 侧栏 */
$('btnSide').addEventListener('click',()=>{
  side.classList.toggle('open');
  if(side.classList.contains('open')) loadMemory();
});
$('sideTabs').addEventListener('click',e=>{
  const b=e.target.closest('button[data-pane]'); if(!b)return;
  [...document.querySelectorAll('#sideTabs button')].forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='pane'+(b.dataset.pane==='mem'?'Mem':'Tasks')));
  if(b.dataset.pane==='mem') loadMemory();
});
async function loadMemory(){
  if(Date.now()-(loadMemory._t||0)<5000) return;
  loadMemory._t=Date.now();
  try{
    const j=await (await fetch('/api/memory',{cache:'no-store'})).json();
    const her=j.her||{}, mine=j.mine||'';
    $('memCount').textContent=her.count?`（共 ${her.count} 条）`:'';
    $('herMems').innerHTML=(her.memories||[]).map(m=>
      `<div class="mitem ${m.importance>=3?'hot':''}">${esc(m.text)}<span class="imp">${m.importance}</span></div>`
    ).join('')||'<div class="moodbar"><span>还没记住什么</span></div>';
    const st=her.state||{};
    $('herMood').innerHTML=Object.entries(st).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>`<span>${k} ${Math.round(v)}</span>`).join('')||'<span>不知道</span>';
    $('herDiary').innerHTML=(her.diary||[]).map(d=>
      `<div style="font-size:11px;color:#93a4b6;margin:5px 0 3px">${d.day}</div><div class="diary">${esc(d.content)}</div>`
    ).join('')||'<div class="moodbar"><span>还没写</span></div>';
    $('myMem').textContent=mine||'（还没写下来）';
  }catch(e){ $('myMem').textContent='记忆读取失败'; }
}

/* 房间切换 */
function renderRooms(rooms){
  const el=$('rooms');
  if(!rooms||!rooms.length){ el.innerHTML=''; return; }
  el.innerHTML=rooms.map(r=>{
    const n = r.id===curRoom ? '' : (roomLastTotal[r.id]!=null && r.count>roomLastTotal[r.id]
        ? `<span class="n">+${r.count-roomLastTotal[r.id]}</span>` : '');
    return `<button data-room="${r.id}" class="${r.id===curRoom?'on':''}" title="${esc(r.desc||'')}">${r.icon||''} ${esc(r.name||r.id)}${n}</button>`;
  }).join('');
}
$('rooms').addEventListener('click', e=>{
  const b=e.target.closest('button[data-room]');
  if(!b || b.dataset.room===curRoom) return;
  if(!roomLastTotal[curRoom]) roomLastTotal[curRoom]=0;
  // 记下当前房间读到哪
  roomScroll[curRoom] = feed.scrollTop;
  curRoom=b.dataset.room;
  lastKey=null; lastSig=''; renderedKeys=[]; seenKeys.clear();
  unread=0;
  feed.innerHTML='<div class="empty">正在切房间…</div>';
  tick();
});

/* 工具 */
function hhmm(ts){const d=new Date(ts*1000),p=n=>String(n).padStart(2,'0');return p(d.getHours())+':'+p(d.getMinutes());}
function fullTime(ts){
  const d=new Date(ts*1000);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${hhmm(ts)}`;
}
function dayLab(ts){
  const d=new Date(ts*1000),t=new Date();
  if(d.toDateString()===t.toDateString())return '今天';
  const y=new Date(t.getTime()-864e5);
  if(d.toDateString()===y.toDateString())return '昨天';
  return (d.getMonth()+1)+'月'+d.getDate()+'日';
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
/* @ 名字高亮（QQ/微信那味儿） */
function atText(s){
  return esc(s).replace(/@(大肥鱼|鲸鱼少女|妈妈|宝宝)/g,'<span class="at">@$1</span>');
}
function toastMsg(t){ toast.textContent=t; toast.classList.add('show'); clearTimeout(toastMsg._t); toastMsg._t=setTimeout(()=>toast.classList.remove('show'),1600); }
function copyText(t){ navigator.clipboard?.writeText(t).then(()=>toastMsg('复制好了')).catch(()=>toastMsg('复制失败')); }

/* 渲染 */
/* 单条消息 → HTML（全量和追加都走这里） */
function buildRow(m, prev){
  const role=['baby','mom','fish'].includes(m.role)?m.role:(m.role==='dsh'?'dsh':'tool');
  const isMe=role==='baby';
  const isNew=!seenKeys.has(m.key);
  seenKeys.add(m.key);

  // 拍一拍 / 系统派单：不进气泡，走居中的提示条
  if(m.kind==='nudge' || m.kind==='task' || m.role==='system'){
    const cls = m.kind==='task' ? 'nudge task' : 'nudge';
    return `<div class="${cls}" role="status" data-key="${m.key}"><span>${esc(m.text)}</span></div>`;
  }
  const compact = prev && prev.role===m.role && (m.ts-prev.ts)<300;
  let av;
  if(compact) av='<div class="av ghost"></div>';
  else if(isMe) av='<img class="av" src="/assets/baby.jpg" alt="宝宝">';
  else if(AV[role]) av=`<img class="av" src="${AV[role]}" alt="">`;
  else av=`<div class="av tool${role==='dsh'?' dsh':''}">${ICON[m.role]||'⚙'}</div>`;
  const quoteHtml = m.quote ? `<div class="quote"><b>${esc(m.quote.who)}</b>：${esc(m.quote.text||'')}</div>` : '';
  const inner=m.media
    ? `<div class="bubble meme"><img src="${m.media}" alt="表情包" onerror="this.onerror=null;this.parentNode.textContent='[表情包]';this.parentNode.style.padding='8px 12px';this.parentNode.style.fontSize='12px';this.parentNode.style.color='#8b9aab'">${(m.text&&m.text.trim()&&m.text!=='[表情]')?`<div class="capt">${esc(m.text)}</div>`:''}</div>`
    : `<div class="bubble">${atText(m.text)}</div>`;
  let extra='';
  if(m.channel==='QQ')extra='QQ';
  if(role==='baby'){
    const wm=!m.answered_mom,wf=!m.answered_fish;
    if(wm&&wf)extra='等两个人回'; else if(wm)extra='等妈妈'; else if(wf)extra='等她';
  }
  const who = compact ? '' : (role==='baby'
    ? `<div class="who">${extra?`<span class="ch">${extra}</span>`:''}<span title="${fullTime(m.ts)}">${hhmm(m.ts)}</span></div>`
    : `<div class="who"><span>${NAME[m.role]||m.who||'某人'}</span>${extra?`<span class="ch">${extra}</span>`:''}<span title="${fullTime(m.ts)}">${hhmm(m.ts)}</span></div>`);
  const ops = `<div class="msg-ops">
      <button data-op="copy" data-key="${m.key}" title="复制" aria-label="复制">⧉</button>
      <button data-op="quote" data-key="${m.key}" title="引用回复" aria-label="引用">↩</button>
      ${isMe&&m.id?`<button data-op="del" data-key="${m.key}" title="撤回" aria-label="撤回">✕</button>`:''}
    </div>`;
  const raw=(m.text||'').replace(/"/g,'&quot;');
  return `<div class="row ${role}${isNew?' new':''}${compact?' compact':''}" role="article" data-key="${m.key}" data-role="${role}" data-text="${raw}">${av}<div class="body">${who}${quoteHtml}${inner}${ops}</div></div>`;
}

let renderedKeys=[];
let lastSig='';
function render(d){
  const msgs=d.messages||[], a=d.agents||{}, s=d.status||{};
  const mom=a.mom_alive?'<span class="ok">妈妈在</span>':'<span class="bad">妈妈没动静</span>';
  const fis=(a.fish_age!=null&&a.fish_age<900)?'<span class="ok">她在</span>':'<span class="bad">她安静</span>';
  const her=s.her_last?`她 ${Math.max(0,Math.round((d.server_ts-s.her_last)/60))} 分钟前说过话`:'';
  const v=s.vals||{};
  const mood=Object.entries(v).map(([k,x])=>`${k}${Math.round(x)}`).join(' · ');
  hsub.innerHTML=`${mom} · ${fis}${her?' · '+her:''}${mood?' · '+mood:''}`;
  renderTasks(d.tasks||[]);
  renderRooms(d.rooms||[]);
  $('loadmore').classList.toggle('show', !!d.has_more);

  if(!msgs.length){ feed.innerHTML='<div class="empty">屋里还没人说话</div>'; renderedKeys=[]; lastSig=''; return; }
  const newest=msgs[msgs.length-1].key;
  const totalNow=d.total||msgs.length;

  // 消息列表 + 每条的「回了没」状态一起算签名。任何变化都得重画，
  // 否则「等妈妈回」的标签会一直挂着不消失（v2 踩过的坑）
  const sig = totalNow+'|'+msgs.length+'|'
      + msgs.map(m=>m.key+(m.answered_mom?'1':'0')+(m.answered_fish?'1':'0')).join(',');
  if(sig===lastSig){ return; }
  lastSig=sig;

  if(lastKey && totalNow>lastTotal){
    const added=totalNow-lastTotal;
    if(!atBottom){ unread+=added; updateJump(); blinkTitle(); }
  }
  lastTotal=totalNow;
  lastKey=newest;

  msgIndex=new Map();
  for(const m of msgs) msgIndex.set(m.key,m);

  const keys=msgs.map(m=>m.key);
  const pureAppend = renderedKeys.length>0
      && keys.length>renderedKeys.length
      && renderedKeys.every((k,i)=>k===keys[i]);

  if(pureAppend){
    // 只把新来的几条插到末尾，旧的不动——不闪、也不重建 DOM
    let html='', prev=msgs[renderedKeys.length-1];
    for(const m of msgs.slice(renderedKeys.length)){
      if(dayLab(m.ts)!==dayLab(prev.ts)) html+=`<div class="day"><span>${dayLab(m.ts)}</span></div>`;
      html+=buildRow(m, prev);
      prev=m;
    }
    const empty=feed.querySelector('.empty');
    if(empty) empty.remove();
    feed.insertAdjacentHTML('beforeend', html);
    renderedKeys=keys;
    applySearch();
    if(atBottom||first){
      first=false;
      const p=feed.style.scrollBehavior; feed.style.scrollBehavior='auto';
      feed.scrollTop=feed.scrollHeight; feed.style.scrollBehavior=p||'';
    }
    return;
  }

  // 全量重建（首次、撤回、加载更早、对不上时）
  let html='', lastDay='', prev=null;
  for(const m of msgs){
    const dl=dayLab(m.ts);
    if(dl!==lastDay){ html+=`<div class="day"><span>${dl}</span></div>`; lastDay=dl; prev=null; }
    html+=buildRow(m, prev);
    prev=m;
  }
  feed.innerHTML=html;
  renderedKeys=keys;
  applySearch();
  if(atBottom||first){
    first=false;
    const jump=()=>{const p=feed.style.scrollBehavior;feed.style.scrollBehavior='auto';feed.scrollTop=feed.scrollHeight;feed.style.scrollBehavior=p||'';};
    jump();requestAnimationFrame(jump);setTimeout(jump,60);setTimeout(jump,400);
  } else if(roomScroll[curRoom]!=null){
    feed.scrollTop = roomScroll[curRoom];
  }
}

/* 双击头像 = 拍一拍（QQ 那个）。加冷却，别让手滑连点刷屏 */
let lastNudge = 0;
feed.addEventListener('dblclick', async e=>{
  const av=e.target.closest('.av');
  if(!av) return;
  const row=av.closest('.row');
  if(!row) return;
  const role=row.dataset.role;
  if(role==='baby') return;                 // 不能拍自己
  const now=Date.now();
  if(now-lastNudge < 2000){                 // 两秒内只能拍一次
    toastMsg('刚拍过了，缓一下');
    return;
  }
  lastNudge=now;
  const name=NAME[role]||'她';
  av.classList.add('shake');
  setTimeout(()=>av.classList.remove('shake'),500);
  toastMsg(`拍了${name}一下`);
  await postSay({text:`宝宝拍了拍${name}`, kind:'nudge'});
});

/* 消息操作（事件委托） */
feed.addEventListener('click', async e=>{
  const b=e.target.closest('button[data-op]');
  if(b){
    const m=msgIndex.get(b.dataset.key); if(!m) return;
    if(b.dataset.op==='copy') copyText(m.text||'[表情包]');
    if(b.dataset.op==='quote') setQuote(m);
    if(b.dataset.op==='del'){
      if(!confirm('撤回这条？')) return;
      await fetch('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:m.id})});
      lastKey=null; seenKeys.delete(m.key); tick(); toastMsg('撤回了');
    }
    return;
  }
  const img=e.target.closest('.bubble.meme img');
  if(img){ $('lightboxImg').src=img.src; $('lightbox').classList.add('show'); }
});
$('lightbox').addEventListener('click',()=>$('lightbox').classList.remove('show'));

/* 右键菜单 */
feed.addEventListener('contextmenu',e=>{
  const row=e.target.closest('.row'); if(!row) return;
  e.preventDefault();
  const m=msgIndex.get(row.dataset.key); if(!m) return;
  ctx.innerHTML=`
    <button data-act="copy">复制</button>
    <button data-act="quote">引用回复</button>
    ${m.role==='baby'&&m.id?'<button data-act="del" class="danger">撤回</button>':''}`;
  ctx.style.left=Math.min(e.clientX, innerWidth-160)+'px';
  ctx.style.top=Math.min(e.clientY, innerHeight-140)+'px';
  ctx.classList.add('show');
  ctx.onclick=async ev=>{
    const btn=ev.target.closest('button'); if(!btn) return;
    const act=btn.dataset.act;
    ctx.classList.remove('show');
    if(act==='copy') copyText(m.text||'[表情包]');
    if(act==='quote') setQuote(m);
    if(act==='del'){
      await fetch('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:m.id})});
      lastKey=null; seenKeys.delete(m.key); tick(); toastMsg('撤回了');
    }
  };
});
document.addEventListener('click',e=>{ if(!ctx.contains(e.target)) ctx.classList.remove('show'); });

/* 快捷键 */
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openSearch(true); }
  if(e.key==='Escape'){
    if($('lightbox').classList.contains('show')) $('lightbox').classList.remove('show');
    else if(memesEl.classList.contains('open')) memesEl.classList.remove('open');
    else if($('searchbar').classList.contains('open')) openSearch(false);
    else if(quotebar.classList.contains('show')){ quote=null; quotebar.classList.remove('show'); }
    else if(ctx.classList.contains('show')) ctx.classList.remove('show');
  }
});

/* 新消息闪烁 */
function blinkTitle(){
  if(!document.hidden){ return; }
  if(blinkTimer) return;
  let on=false;
  blinkTimer=setInterval(()=>{
    on=!on;
    document.title=on?(unread?`(${unread}) 新消息`:'新消息'):'一家三口';
  },900);
}
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){ clearInterval(blinkTimer); blinkTimer=null; document.title='一家三口'; unread=0; updateJump(); }
});

/* 任务 */
function renderTasks(tasks){
  const el=$('tasklist');
  if(!tasks.length){ el.innerHTML='<div style="color:#8b9aab;font-size:12px;text-align:center;padding:16px 0">还没有任务</div>'; return; }
  el.innerHTML=tasks.slice().reverse().map(t=>{
    const who=t.assignee==='mom'?'妈妈':t.assignee==='fish'?'大肥鱼':t.assignee==='dsh'?'DSH':'两人';
    const st=t.status==='done'?'done':t.status==='doing'?'doing':t.status==='cancelled'?'cancelled':t.status==='blocked'?'blocked':'';
    const lab=t.status==='done'?'已完成':t.status==='doing'?'在做':t.status==='cancelled'?'已取消':t.status==='blocked'?'已失败':'待办';
    return `<div class="task"><div class="t">${esc(t.title)}</div>
      <div class="m"><span class="pill">${who}</span><span class="pill ${st}">${lab}</span>
      <span class="pill" data-act="next" data-id="${t.id}" style="cursor:pointer">改状态</span></div>
      ${t.result?`<div class="r">${esc(String(t.result).slice(0,160))}</div>`:''}</div>`;
  }).join('');
  el.querySelectorAll('[data-act=next]').forEach(b=>{
    b.addEventListener('click',async()=>{
      const cur=tasks.find(x=>x.id===b.dataset.id);
      const next=cur.status==='todo'?'doing':cur.status==='doing'?'done':'todo';
      await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'update',id:b.dataset.id,status:next})});
      tick();
    });
  });
}
$('addTask').addEventListener('click',async()=>{
  const title=$('ntTitle').value.trim(); if(!title)return;
  await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({op:'add',title,assignee:$('ntWho').value})});
  $('ntTitle').value=''; tick();
});
$('ntTitle').addEventListener('keydown',e=>{if(e.key==='Enter')$('addTask').click();});

/* 发送 */
$('btnQQ').addEventListener('click',e=>{
  toQQ=!toQQ;
  e.target.textContent='QQ 同步：'+(toQQ?'开':'关');
  e.target.classList.toggle('on',toQQ);
  $('hintText').textContent=toQQ?'回车发送 · 这句会同时发到 QQ':'回车发送 · Shift+回车换行 · Ctrl+K 搜索';
});
async function postSay(payload){
  try{
    const body={from:'宝宝',to_qq:toQQ,room:curRoom,...payload};
    if(quote) body.quote=quote;
    const r=await fetch('/api/say',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();
    if(!j.ok){ alert('没发出去：'+(j.error||'未知')); return false; }
    quote=null; quotebar.classList.remove('show');
    atBottom=true; lastKey=null; tick(); return true;
  }catch(e){ alert('没发出去：'+e.message); return false; }
}
async function send(){
  const text=sayEl.value.trim(); if(!text)return;
  sendBtn.disabled=true; sendBtn.textContent='发送中';
  showPending(text);
  const ok=await postSay({text});
  sendBtn.disabled=false; sendBtn.textContent='发送';
  clearPending();
  if(ok){ sayEl.value=''; sayEl.style.height='auto'; localStorage.removeItem('draft'); }
  else { showFailed(text); }
}
/* 发送中的临时气泡 */
function showPending(text){
  clearPending();
  const el=document.createElement('div');
  el.className='row baby pending-row';
  el.id='pendingRow';
  el.innerHTML=`<img class="av" src="/assets/baby.jpg" alt=""><div class="body"><div class="who"><span class="ch">发送中…</span></div><div class="bubble" style="opacity:.62">${esc(text)}</div></div>`;
  feed.appendChild(el);
  feed.scrollTop=feed.scrollHeight;
}
function clearPending(){ const e=$('pendingRow'); if(e) e.remove(); }
function showFailed(text){
  const el=document.createElement('div');
  el.className='row baby';
  el.id='failedRow';
  el.innerHTML=`<img class="av" src="/assets/baby.jpg" alt=""><div class="body"><div class="who"><span class="ch" style="color:#c2564f">没发出去</span></div><div class="bubble" style="border-color:#e8b4b0;background:#fdeeec"><div style="color:#a8483f;font-size:12.5px;margin-bottom:6px">网络或服务出问题，这条没送到</div><button id="retryBtn" style="border:none;border-radius:8px;padding:5px 12px;background:#c2564f;color:#fff;font-size:12px;cursor:pointer;font-family:inherit">重发</button></div></div>`;
  feed.appendChild(el);
  feed.scrollTop=feed.scrollHeight;
  $('retryBtn').onclick=async()=>{
    el.remove(); sayEl.value=text; await send();
  };
}
sendBtn.addEventListener('click',send);

$('loadMoreBtn').addEventListener('click',()=>{ limit+=260; lastKey=null; tick(); });

let linkLost=false;
async function tick(){
  try{
    const j=await (await fetch('/api/data?limit='+limit+'&room='+curRoom,{cache:'no-store'})).json();
    if(linkLost){ linkLost=false; }
    render(j);
  }catch(e){
    // 页面不更新时得让人看得见，不然会以为是自己眼花
    if(!linkLost){
      linkLost=true;
      hsub.innerHTML='<span class="bad">连不上看板，正在重试…</span>';
    }
  }
}
tick();
if(location.hash==='#memes'){ memesEl.classList.add('open'); loadMemes(); }
if(location.hash==='#mem'||location.hash==='#tasks'){
  side.classList.add('open');
  const want=location.hash==='#mem'?'mem':'tasks';
  document.querySelectorAll('#sideTabs button').forEach(b=>b.classList.toggle('on',b.dataset.pane===want));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='pane'+(want==='mem'?'Mem':'Tasks')));
  if(want==='mem') loadMemory();
}
/* 标签页隐藏时别空转轮询，省电也省服务端 */
let pollTimer=null;
function startPoll(){
  if(pollTimer) return;
  pollTimer=setInterval(()=>{
    if(document.hidden) return;
    tick();
    if(side.classList.contains('open')&&$('paneMem').classList.contains('on')) loadMemory();
  },2000);
}
function stopPoll(){ clearInterval(pollTimer); pollTimer=null; }
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ stopPoll(); }
  else { startPoll(); tick(); }
});
startPoll();
</script>
