<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>BEAM-AI 情绪框架 · 六层细节 + 插件全景 + 闭环</title>
<style>
  :root{--bg:#f6f2ea;--ink:#2b2b2b;--muted:#7a7368;--line:#8a8278;}
  *{box-sizing:border-box}
  body{margin:0;background:#e9e4da;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;color:var(--ink)}
  .page{width:2520px;margin:0 auto;padding:26px 0 40px}
  .title{font-size:30px;font-weight:800;margin:0 0 6px 60px}
  .sub{font-size:15px;color:var(--muted);margin:0 0 16px 60px}
  svg{display:block;margin:0 auto;background:var(--bg);border-radius:18px;box-shadow:0 6px 30px rgba(0,0,0,.12)}
  .sec{font-size:19px;font-weight:800;fill:#3f3b34}
  .lay-no{font-size:26px;font-weight:800;fill:#fff}
  .lay-name{font-size:18px;font-weight:800}
  .kv{font-size:12px;fill:#4a453d}
  .kvl{font-size:11px;fill:#8a8175;letter-spacing:.4px}
  .code{font-size:11px;fill:#6b6459;font-family:Consolas,monospace}
  .plug-name{font-size:14px;font-weight:700}
  .plug-role{font-size:11px;fill:#4a453d}
  .plug-tag{font-size:10.5px}
  .loop{font-size:13.5px;fill:#3f3b34}
  .legend{font-size:12.5px;fill:#5f584e}
</style>
</head>
<body>
<div class="page">
  <div class="title">BEAM-AI 情绪框架 · 六层细节 + 插件全景 + 五条闭环</div>
  <div class="sub">上半：情绪框架每层输入/处理/输出（可手算）· 中间：25 个插件在闭环里的角色 · 下半：五条闭环怎么首尾相接</div>
  <svg id="d" width="2400" height="2900" viewBox="0 0 2400 2900"></svg>
</div>
<script>const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("d");
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;}
function txt(a,s,p){const e=el("text",a,p);e.textContent=s;return e;}
function wrap(s,max){const out=[];let cur="";for(const ch of s){cur+=ch;if(cur.length>=max){out.push(cur);cur="";}}if(cur)out.push(cur);return out;}
function box(x,y,w,label,content,maxCh,lineH,fs){
  txt({x:x,y:y,class:"kvl"},label);
  const lines=wrap(content,maxCh);
  lines.forEach((ln,i)=>txt({x:x,y:y+20+i*lineH,class:"kv","font-size":(fs||13)},ln));
}

const layers=[
 {no:"L0",name:"身体 / 环境",color:"#5b8def",code:"beams_core/body.py",
  input:"cpu · mem · latency · tools · errors_1h · disk_free",
  proc:"归一化 0~1；延迟对数压缩；工具可用性打分；异常降级不抛错",
  output:"body 向量 6 维（资源/负载/延迟/错误率/工具/预算）",
  note:"每 5s 采样一次"},
 {no:"L1",name:"内感受 · 效价",color:"#2f9e6e",code:"beams_core/intero.py",
  input:"body 向量 + 外部 needs",
  proc:"一阶滞后（tau 60~180s）；持续更新、不随任务切换归零",
  output:"7 维：效价/唤醒/支配/资源/预测误差/负载/行动成本",
  note:"身体 → 连续效价，不产生情绪标签"},
 {no:"L2",name:"双速情绪（核心）",color:"#d99a2b",code:"beams_core/affect2.py",
  input:"内感受 + 事件 appraisal + 慢通道",
  proc:"快通道：半衰期 4/3/6 分钟，单拍位移≤0.28；慢通道：mood 6h / stress 24h / bonding 30d / fatigue 8h",
  output:"fast[V/A/D] + slow[mood/stress/bonding/fatigue] + 压力 / 负性负荷",
  note:"事件 55% 吸收；慢通道调基线"},
 {no:"L3",name:"动机仲裁（单点）",color:"#8b6fe0",code:"beams_core/drive.py",
  input:"效价/唤醒/资源/预测误差/压力/疲劳/联结/独处时长",
  proc:"五动机强度 → 紧迫度 → priority=强度×(0.45+0.55×紧迫)×习惯奖励；反失衡：连续10次衰减0.72、18次强制轮换、冷却120s",
  output:"winner（探索/修复/连接/完成/回避）+ urgency + inhibit",
  note:"所有出口读同一个 winner"},
 {no:"L4",name:"元认知 · 叙事",color:"#d15656",code:"beams_core/meta.py",
  input:"回复长度 + 用户下一句情绪",
  proc:"每 12 轮审核：too_cold / too_hot / too_long / too_short / ok → 有步长调参",
  output:"自我模型（能力/局限/置信度）+ 叙事（2-gram 去重，最多 8 条）+ 参数微调",
  note:"无真实反馈不覆盖结论"},
 {no:"L5",name:"表达门控",color:"#6b7a8f",code:"beams_core/express.py",
  input:"情绪 + 动机 + 审核参数 + 恢复期标记",
  proc:"参数映射：talkative / warmth / playfulness / brevity / emoji / inhibition；注入只写旧系统没有的",
  output:"<inner> 91 字注入 + 8 维语音情绪向量（和≤0.6）",
  note:"无独立决策权，不许绕过仲裁"}
];

const plugins=[
 {n:"whale_beams",t:"新内核",c:"#2f9e6e",r:"情绪/动机/元认知 · 写 beams_state / snapshot / audit",io:"写·核心"},
 {n:"whale_affect",t:"旧情绪",c:"#2f9e6e",r:"旧 VAD 内核 · 热启动数据源（bond 99→0.99）",io:"只读"},
 {n:"whale_brain",t:"人设/注入",c:"#5b8def",r:"人设+意图+psyche 注入 · 读状态",io:"读·注入"},
 {n:"whale_state",t:"事实源",c:"#5b8def",r:"世界/日程/穿搭/身体事实 · 写 state.json",io:"写·注入"},
 {n:"whale_urge",t:"欲望",c:"#8b6fe0",r:"说话欲望积分（漏积分 V + 阈值 θ）",io:"写 urge.json"},
 {n:"whale_drive",t:"欲望",c:"#8b6fe0",r:"三欲望（社交/表达/好奇）→ drives.json",io:"写 drives"},
 {n:"whale_voice",t:"闸门",c:"#d15656",r:"主动性唯一出站闸门 · token/由头/后果",io:"写 voice_gate"},
 {n:"proactive_chat",t:"主动",c:"#d15656",r:"主动消息 · 读 outlet 决定开口",io:"读 outlet"},
 {n:"whale_memory",t:"记忆",c:"#6b7a8f",r:"分层记忆 · 结构化记录",io:"读写"},
 {n:"whale_memoryflow",t:"记忆",c:"#6b7a8f",r:"记忆流 · 注入摘要",io:"读写·注入"},
 {n:"iris_chat_memory",t:"记忆",c:"#6b7a8f",r:"长上下文记忆 · 清道夫",io:"读写"},
 {n:"whale_fishtalk",t:"反八股",c:"#d99a2b",r:"真人语料文风包 + 八股检测改写",io:"注入·改写"},
 {n:"speech_style",t:"风格",c:"#d99a2b",r:"说话风格注入",io:"注入"},
 {n:"reply_chunker",t:"表达",c:"#d99a2b",r:"分句 / 分段发送",io:"后处理"},
 {n:"reply_merge",t:"表达",c:"#d99a2b",r:"回复合并防刷屏",io:"后处理"},
 {n:"whale_bili",t:"场景",c:"#5b8def",r:"陪看 B 站 · 盯屏 / 视频上下文",io:"读写场景"},
 {n:"dafeiyu_meme",t:"表情",c:"#d99a2b",r:"表情包检索 · 22~60% 概率",io:"后处理"},
 {n:"virtual_life",t:"场景",c:"#5b8def",r:"虚拟生活 · 日程 / 活动",io:"读写"},
 {n:"dafeiyu_soul",t:"灵魂",c:"#6b7a8f",r:"灵魂引擎 · 心跳 11~26min",io:"写"},
 {n:"dere_lover",t:"关系",c:"#8b6fe0",r:"关系 / 心动 / 状态机",io:"写"},
 {n:"computer_use",t:"能力",c:"#6b7a8f",r:"电脑操作工具",io:"工具"},
 {n:"pc_explore",t:"能力",c:"#6b7a8f",r:"本机探索",io:"工具"},
 {n:"qq_suite",t:"平台",c:"#5b8def",r:"QQ 套件（昵称 / 戳一戳）",io:"平台"},
 {n:"angel_eye",t:"其他",c:"#6b7a8f",r:"旧插件 · 不进情绪链路",io:"保留"},
 {n:"anima_master",t:"其他",c:"#6b7a8f",r:"旧插件 · 不进情绪链路",io:"保留"}
];

const loops=[
 {t:"① 情绪闭环（文本）",c:"#5b8def",chain:"QQ 消息 → AstrBot → 文本事件 → L2 快/慢通道 → 状态文件 → L5 门控 → <inner> 注入 → LLM 回复 → 用户反应 → L4 审核 → 下行调参 → 回到 L2"},
 {t:"② 语音情绪闭环（双向）",c:"#8b6fe0",chain:"语音 → 声纹门控 → ASR(8913) → laya(8901 8类) → QwenEmo 校准 → L2（goal_congruence）→ 状态改变 → L5 8维向量 → feiyu_client → IndexTTS(8912) → 声音输出"},
 {t:"③ 动机闭环",c:"#2f9e6e",chain:"L2 情绪 → L3 五动机仲裁 → winner/urgency → 出口（proactive / 表情 / B站 / 陪看）→ 行动结果 → L2 新事件 → 再仲裁（反失衡轮换）"},
 {t:"④ 审核闭环",c:"#d15656",chain:"回复文本（记录长度）→ 用户下一句情绪 → L4 每12轮审核 → too_cold/hot 判定 → 调 warmth/inhibit（步长+包络）→ L5 下一轮表达变化"},
 {t:"⑤ 记忆/身份闭环",c:"#6b7a8f",chain:"对话 → 记忆插件（whale_memory / memoryflow / iris）→ 下次注入 LLM → 关系事实 → dere_lover / whale_affect → 热启动 BEAM → 身份叙事（L4）"}
];

// ── 六层 ──
layers.forEach((L,i)=>{
  const y=80+i*190, h=172;
  el("rect",{x:50,y:y,width:2300,height:h,rx:14,fill:"#fffdf8",stroke:"#d8d0c2","stroke-width":1.2});
  el("rect",{x:50,y:y,width:126,height:h,rx:14,fill:L.color});
  el("rect",{x:160,y:y,width:16,height:h,fill:L.color});
  txt({x:113,y:y+56,"text-anchor":"middle",class:"lay-no"},L.no);
  wrap(L.name,5).forEach((ln,k)=>txt({x:113,y:y+84+k*22,"text-anchor":"middle",class:"lay-name",fill:"#fff"},ln));
  box(200,y+22,470,"输入",L.input,22,20);
  box(700,y+22,640,"处理",L.proc,30,20);
  box(1370,y+22,560,"输出",L.output,26,20);
  box(1960,y+22,370,"代码 / 说明",L.code+" ｜ "+L.note,22,20);
});

// ── 插件 ──
txt({x:50,y:1270,class:"sec"},"二、25 个插件在闭环里的角色（新内核 1 + 旧 19 + 语音四模型服务）");
txt({x:50,y:1300,class:"kvl"},"颜色：绿=情绪内核 · 蓝=注入/事实 · 紫=动机/关系 · 红=闸门/主动 · 黄=表达/风格 · 灰=记忆/能力");
plugins.forEach((p,i)=>{
  const col=i%5, row=Math.floor(i/5);
  const x=50+col*460, y=1320+row*164, w=440, h=148;
  el("rect",{x:x,y:y,width:w,height:h,rx:12,fill:"#fff",stroke:p.c,"stroke-width":1.3});
  el("rect",{x:x,y:y,width:w,height:6,rx:3,fill:p.c});
  txt({x:x+16,y:y+36,class:"plug-name"},p.n);
  el("rect",{x:x+w-96,y:y+18,width:80,height:22,rx:11,fill:"#f2ede2",stroke:"#c9c0b0"});
  txt({x:x+w-56,y:y+33,"text-anchor":"middle",class:"plug-tag",fill:"#6b6459"},p.t);
  wrap(p.r,23).forEach((ln,k)=>txt({x:x+16,y:y+66+k*22,class:"plug-role","font-size":"12.5"},ln));
  txt({x:x+16,y:y+h-12,class:"plug-tag","font-size":"11.5",fill:p.c},"读/写："+p.io);
});

// ── 闭环 ──
txt({x:50,y:2230,class:"sec"},"三、五条闭环怎么首尾相接（这是「像人」的关键：每条都能回到情绪）");
loops.forEach((lp,i)=>{
  const y=2276+i*86;
  el("rect",{x:50,y:y-26,width:2300,height:74,rx:12,fill:"#fffdf8",stroke:"#e0d8c9"});
  el("rect",{x:50,y:y-26,width:8,height:74,rx:4,fill:lp.c});
  txt({x:78,y:y-2,class:"plug-name","font-size":"15",fill:lp.c},lp.t);
  const parts=lp.chain.split("→");
  let cx=78;
  parts.forEach((pt,k)=>{
    const t=pt.trim();
    txt({x:cx,y:y+30,class:"loop","font-size":"12.5"},t);
    cx+=t.length*12.5+8;
    if(k<parts.length-1){txt({x:cx-2,y:y+30,class:"loop","font-size":"12.5",fill:lp.c},"→");cx+=16;}
  });
});
txt({x:50,y:2760,class:"legend"},"图例：六层框架全部有界、确定性、可手算；情绪只改温度/长度/倾向，不改事实 —— 不做过度活人化。");
txt({x:50,y:2786,class:"legend"},"数据契约：beams_state.json（唯一状态写者）· beams_snapshot.json（outlet/urgency 对外）· outlet_shadow.json（S3 接管接缝）· obs/audit（流水+审计）。");
draw();
function draw(){}</script>
</body>
</html>
