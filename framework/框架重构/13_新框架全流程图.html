];
const M={}; cards.forEach(c=>M[c.id]=c);
const CX=id=>M[id].x+M[id].w/2, CY=id=>M[id].y+M[id].h/2;

const links=[
 {a:"a1",b:"a3",l:"消息事件",c:"#5b8def"},
 {a:"a3",b:"a4",l:"WS 推送",c:"#5b8def"},
 {a:"a2",b:"b2",l:"wav",c:"#8b6fe0"},
 {a:"a4",b:"b3",l:"事件",c:"#8b6def"},
 {a:"b1",b:"b3",l:"放行",c:"#8b6fe0"},
 {a:"b2",b:"b3",l:"声纹通过",c:"#d15656",dash:true},
 {a:"b3",b:"c3",l:"情绪事件",c:"#2f9e6e",em:true},
 {a:"c3",b:"c4",l:"情绪→动机",c:"#2f9e6e"},

 {a:"d1",b:"d7",l:"",c:"#d99a2b"},

 {a:"e1",b:"e2",l:"注入 91 字",c:"#d9772b"},

 {a:"e3",b:"f1",l:"原文",c:"#d15656",em:true},

 {a:"c6",b:"f2",l:"8维情绪向量",c:"#8b6fe0",dash:true},
 {a:"f2",b:"f3",l:"/speak",c:"#d15656"},

 {a:"f4",b:"f5",l:"",c:"#d15656"},

 {a:"g1",b:"e2",l:"记忆注入",c:"#6b7a8f",dash:true},
 {a:"g2",b:"c0",l:"落库",c:"#6b7a8f",dash:true},
 {a:"g4",b:"c2",l:"健康",c:"#d15656",dash:true},
 // ── 反馈闭环（v2 补）──

(function(){
  const defs=el("defs",{});
  [["ar-b","#5b8def"],["ar-g","#2f9e6e"],["ar-a","#d99a2b"],["ar-o","#d9772b"],["ar-r","#d15656"],["ar-p","#8b6fe0"],["ar-y","#6b7a8f"],
   ["ar-m","#2f8fef"],["ar-f","#e08a2b"],["ar-e","#d13636"],["ar-u","#8b4fe0"]].forEach(p=>{
    const m=el("marker",{id:p[0],viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"},defs);
    el("path",{d:"M 0 0 L 10 5 L 0 10 z",fill:p[1]},m);
  });
})();

// 阶段带
bands.forEach(b=>{
  el("rect",{x:40,y:b.y,width:2320,height:b.h,rx:14,fill:b.c,opacity:.35,stroke:b.b,"stroke-width":1.1,"stroke-dasharray":"7 5"});
  txt({x:58,y:b.y+24,class:"band",fill:b.b},b.t);
});

// 连线（先画）
links.forEach(l=>{
  if(l.raw){
    el("path",{d:l.raw,fill:"none",stroke:l.c,"stroke-width":l.em?2.6:1.9,"stroke-dasharray":"7 6",
               "marker-end":"url(#"+ARROW[l.c]+")","stroke-linejoin":"round"});
    if(l.l) txt({x:640,y:24,class:"lb",fill:l.c},l.l);
    return;
  }
  const A=M[l.a],B=M[l.b];
  let x1=CX(l.a),y1=CY(l.a),x2=CX(l.b),y2=CY(l.b);
  // 从卡片边缘出发
  if(Math.abs(x2-x1)>=Math.abs(y2-y1)){ x1= x2>x1? A.x+A.w : A.x; y1=CY(l.a); x2= x2>x1? B.x : B.x+B.w; y2=CY(l.b);}
  else { x1=CX(l.a); y1= y2>y1? A.y+A.h : A.y; x2=CX(l.b); y2= y2>y1? B.y : B.y+B.h; }
  const midx=(x1+x2)/2, midy=(y1+y2)/2;
  const d=`M ${x1} ${y1} L ${midx} ${y1} L ${midx} ${y2} L ${x2} ${y2}`;
  el("path",{d,fill:"none",stroke:l.c,"stroke-width":l.em?2.3:1.6,"stroke-dasharray":l.dash?"6 5":null,
             "marker-end":"url(#"+ARROW[l.c]+")","stroke-linejoin":"round",opacity:.95});
  if(l.l) txt({x:midx+6,y:(y1+y2)/2-6,class:"lb"},l.l);
});

// 卡片
cards.forEach(c=>{
  const col=bands[c.b].b;
  el("rect",{x:c.x,y:c.y,width:c.w,height:c.h,rx:11,fill:"#ffffff",stroke:col,"stroke-width":1.4});
  el("rect",{x:c.x,y:c.y,width:c.w,height:6,rx:3,fill:col});
  el("rect",{x:c.x+10,y:c.y+16,width:42,height:18,rx:9,fill:col});
  txt({x:c.x+31,y:c.y+29,"text-anchor":"middle",class:"num"},c.n);
  if(c.tag){ el("rect",{x:c.x+c.w-58,y:c.y+16,width:48,height:18,rx:9,fill:"#fff4d6",stroke:"#d99a2b"});
    txt({x:c.x+c.w-34,y:c.y+29,"text-anchor":"middle","font-size":"10.5",fill:"#a97500"},c.tag); }
  txt({x:c.x+14,y:c.y+52,class:"t"},c.t);
  txt({x:c.x+14,y:c.y+73,class:"p"},c.p);
  wrap(c.r,Math.floor((c.w-24)/12.5)).forEach((ln,i)=>txt({x:c.x+14,y:c.y+92+i*15,class:"r"},ln));
});

// 图例
const ly=1544;
txt({x:58,y:ly,class:"lg"},"图例（v2 加了反馈）：");
[["#5b8def","实线 = 主链路"],["#2f8fef","蓝虚线 = 记忆反哺"],["#e08a2b","橙虚线 = 全局情感/环境场"],["#2f9e6e","绿虚线 = 动态旁路"],["#d13636","红粗线 = 失败回退/重试"],["#8b4fe0","紫大虚线 = 用户反馈大闭环"]].forEach((it,i)=>{
